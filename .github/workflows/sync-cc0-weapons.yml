name: Sync CC0 weapon assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-cc0-weapons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download audited CC0 GLB weapons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/weapons
          BASE='https://raw.githubusercontent.com/petroulacl/fps-asset-kit/main/weapons/flat_guns_west/Flat%20Guns%20West/GLB'
          curl --fail --location --retry 3 --connect-timeout 20 "$BASE/Pistol_Full_West.glb" -o assets/weapons/pistol.glb
          curl --fail --location --retry 3 --connect-timeout 20 "$BASE/SMG_Compact_West.glb" -o assets/weapons/smg.glb
          curl --fail --location --retry 3 --connect-timeout 20 "$BASE/Shotgun_Pump_West.glb" -o assets/weapons/shotgun.glb
          test "$(wc -c < assets/weapons/pistol.glb)" -gt 1000
          test "$(wc -c < assets/weapons/smg.glb)" -gt 1000
          test "$(wc -c < assets/weapons/shotgun.glb)" -gt 1000

      - name: Commit local weapon assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/weapons
          if git diff --cached --quiet; then
            echo 'Weapon assets already current.'
          else
            git commit -m 'Host audited CC0 weapon GLB assets locally'
            git push
          fi
