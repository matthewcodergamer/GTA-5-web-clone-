name: Apply Project V v9 minimap

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_v9_minimap.py'
      - '.github/workflows/apply-v9-minimap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v9 minimap bridge
        run: python tools/apply_v9_minimap.py
      - name: Validate JavaScript syntax
        run: |
          node --check src/v7.js
          node --check src/main.js
          node --check src/minimap.js
      - name: Validate expected v9 radar features
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PROJECT_V_MINIMAP_V9' src/v7.js
          grep -q 'createProjectVMinimap' src/v7.js
          grep -q 'minimap.update' src/v7.js
          grep -q 'window.ProjectVHUD' src/minimap.js
          grep -q 'setWaypointFromClient' src/minimap.js
          grep -q 'drawNorth' src/minimap.js
          grep -q 'project-v-radar-bars' src/minimap.js
          grep -q 'styles-minimap.css?v=9' index.html
          grep -q 'src/main.js?v=9' index.html
          grep -q "import './v7.js?v=9'" src/main.js
      - name: Commit v9 runtime bridge
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v7.js
          if git diff --cached --quiet; then
            echo 'Project V v9 minimap bridge is already current.'
          else
            git commit -m 'Integrate functional rotating GTA-style minimap'
            git push
          fi
