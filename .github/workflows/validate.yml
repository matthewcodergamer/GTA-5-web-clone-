name: Validate Project V

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bootstrap syntax
        run: node --check src/bootstrap-v2.js
      - name: Check compressed game runtime
        run: |
          base64 -d src/game-v2.js.gz.b64 | gzip -dc > /tmp/game-v2.js
          node --check /tmp/game-v2.js
      - name: Verify required web files and guards
        run: |
          test -f index.html
          test -f styles-v2.css.gz.b64
          test -f src/bootstrap-v2.js
          test -f src/game-v2.js.gz.b64
          grep -q "three@0.185.1" index.html
          grep -q "bootstrap-v2.js" index.html
          if grep -R -E "skeletonHelper\??\.update\(|skeleton\.update\(" -n src index.html 2>/dev/null; then
            echo "Invalid SkeletonHelper update call found"
            exit 1
          fi
