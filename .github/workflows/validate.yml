name: Validate Project V

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check src/main.js
      - name: Verify required web files
        run: |
          test -f index.html
          test -f styles.css
          test -f src/main.js
          grep -q "three@0.185.1" index.html
          if grep -R -F "skeletonHelper?.update" -n src index.html 2>/dev/null; then
            echo "Invalid SkeletonHelper optional update call found"
            exit 1
          fi
