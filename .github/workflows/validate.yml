name: Validate Project V

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Three.js runtime syntax
        run: |
          node --check src/main.js
          node --check src/v7.js
          node --check src/minimap.js

      - name: Verify v9 game shell and radar
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f styles-v7.css
          test -f styles-minimap.css
          test -f src/main.js
          test -f src/v7.js
          test -f src/minimap.js
          test -f docs/minimap-v9.md
          grep -q 'three@0.185.1' index.html
          grep -q './src/main.js?v=9' index.html
          grep -q './styles-v7.css?v=9' index.html
          grep -q './styles-minimap.css?v=9' index.html
          grep -q "import './v7.js?v=9'" src/main.js
          grep -q 'PROJECT_V_MINIMAP_V9' src/v7.js
          grep -q 'createProjectVMinimap' src/v7.js
          grep -q 'minimap.update' src/v7.js
          grep -q 'window.ProjectVHUD' src/minimap.js
          grep -q 'setWaypointFromClient' src/minimap.js
          grep -q 'drawNorth' src/minimap.js
          grep -q 'buildRoute' src/minimap.js
          grep -q 'project-v-radar-bars' src/minimap.js
          grep -q 'id="joystick"' index.html
          grep -q 'id="aimButton"' index.html
          grep -q 'id="fireButton"' index.html
          grep -q 'id="reloadButton"' index.html
          grep -q 'id="runButton"' index.html
          grep -q 'id="jumpButton"' index.html
          grep -q 'let last = performance.now()' src/v7.js
          grep -q 'requestAnimationFrame(frame)' src/v7.js
          grep -q 'rebuildGeometryByBodyRegion' src/v7.js
          grep -q 'WeaponWorldSocket' src/v7.js
          grep -q 'PROJECT_V_ENVIRONMENT_V8' src/v7.js
          grep -q 'GAME_PALETTES' src/v7.js
          grep -q 'buildAtmosphere' src/v7.js

      - name: Guard against known runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -E "skeletonHelper\??\.update\(|skeleton\.update\(" -n src/main.js src/v7.js; then
            echo 'Invalid SkeletonHelper update call found'
            exit 1
          fi
          if grep -q "boot();frame(performance.now())" src/main.js src/v7.js; then
            echo 'Old temporal-dead-zone startup sequence found'
            exit 1
          fi

      - name: Verify locally hosted character, weapon and texture assets
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/michael.fbx
          test -f assets/michael_walk.fbx
          test -f assets/weapons/pistol.glb
          test -f assets/weapons/smg.glb
          test -f assets/weapons/shotgun.glb
          test -f assets/textures/manifest.json
          for f in \
            shoes.webp.b64 hands.webp.b64 pants.webp.b64 mouth.webp.b64 jacket_shirt.webp.b64 \
            hair.00.b64 hair.01.b64 hair.02.b64 hair.03.b64 hair.04.b64 \
            face_body.00.b64 face_body.01.b64; do
            test -s "assets/textures/$f"
          done
          test "$(wc -c < assets/michael.fbx)" -gt 1000000
          test "$(wc -c < assets/michael_walk.fbx)" -gt 1000000
          test "$(wc -c < assets/weapons/pistol.glb)" -gt 1000
          test "$(wc -c < assets/weapons/smg.glb)" -gt 1000
          test "$(wc -c < assets/weapons/shotgun.glb)" -gt 1000
          python - <<'PY'
          from pathlib import Path
          import base64, json

          for path in [Path('assets/michael.fbx'), Path('assets/michael_walk.fbx')]:
              data = path.read_bytes()[:32]
              assert data.startswith(b'Kaydara FBX Binary'), f'{path}: invalid FBX header'
              print(f'{path}: FBX header OK')
          for path in [Path('assets/weapons/pistol.glb'), Path('assets/weapons/smg.glb'), Path('assets/weapons/shotgun.glb')]:
              data = path.read_bytes()[:4]
              assert data == b'glTF', f'{path}: invalid GLB header'
              print(f'{path}: GLB header OK')

          manifest = json.loads(Path('assets/textures/manifest.json').read_text())
          for name, parts in manifest['textures'].items():
              encoded = ''.join((Path('assets/textures') / p).read_text().strip() for p in parts)
              data = base64.b64decode(encoded)
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', f'{name}: invalid WebP bundle'
              print(f'{name}: {len(data):,} byte WebP bundle OK')
          PY
